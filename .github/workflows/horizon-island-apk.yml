name: Horizon Island APK

on:
  push:
    branches: [ "claude/dynamic-island-android-ui-2kwbtz", "main" ]
    paths:
      - "dynamic-island/**"
      - ".github/workflows/horizon-island-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: horizon-island-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dynamic-island
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Compilar APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace assembleRelease
          cp app/build/outputs/apk/release/app-release.apk HorizonIsland.apk
          ls -la HorizonIsland.apk

      - uses: actions/upload-artifact@v4
        with:
          name: HorizonIsland-apk
          path: dynamic-island/HorizonIsland.apk

      - name: Publicar no Release "horizon-island-latest"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete horizon-island-latest --yes --cleanup-tag || true
          gh release create horizon-island-latest HorizonIsland.apk \
            --target "${{ github.sha }}" \
            --prerelease \
            --title "Horizon Island — APK" \
            --notes "APK da ilha dinâmica Project Horizon, compilado automaticamente a partir de ${{ github.sha }}. Baixe HorizonIsland.apk abaixo e instale no Android."
